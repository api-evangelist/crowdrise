name: CrowdRise
description: CrowdRise was an online fundraising platform for charities, nonprofits, and personal causes,
  founded around 2010 by Edward Norton and Robert Wolfe. It let individuals, event participants, and
  organizations create fundraising pages, run peer-to-peer campaigns, and collect donations for good.
  CrowdRise was acquired by GoFundMe in 2017 and subsequently merged into the GoFundMe platform; the
  crowdrise.com domain now 301-redirects to gofundme.com/c/crowdrise. This profile originated as a
  Union Square Ventures portfolio lead; no independent developer portal, documented API, SDKs, or
  discovery surface remains, so the record is retained for provenance only.
